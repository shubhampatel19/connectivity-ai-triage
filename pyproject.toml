[project]
name = "connectivity-ai-triage"
version = "0.1.0"
description = "AI triage for Connectivity support cases: LLM log summaries, runbook search, evals"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15,<2",
    "boto3>=1.35",
    "fastapi>=0.115",
    "fastembed>=0.9,<0.10",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pgvector>=0.3",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
triage = "triage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]
# Line length is the formatter's job; it leaves long strings alone.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM108", "SIM905"]

[tool.uv]
# Resolve only releases published at least two weeks before the lock was
# made: a compromised release is usually caught and yanked within days.
# Move this date forward when you update dependencies.
exclude-newer = "2026-10-16T00:00:00Z"
